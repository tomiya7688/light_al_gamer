[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "light-al-gamer"
version = "0.1.0"
description = "Screenshot-only autonomous 2048 player"
requires-python = ">=3.11"
authors = [{name = "Tomiya"}]
dependencies = ["Pillow==12.3.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.15.22"]

[project.scripts]
light-gamer = "light_gamer.runner:main"

[tool.setuptools.packages.find]
include = ["light_gamer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py311"
extend-exclude = ["artifacts", "review", "pytest-cache-files-*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
