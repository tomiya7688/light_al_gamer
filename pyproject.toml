[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "light-al-gamer"
version = "0.2.0"
description = "Screenshot-only game agents with 2048 and Windows keyboard/mouse backends"
requires-python = ">=3.11"
authors = [{name = "Tomiya"}]
dependencies = ["Pillow==12.3.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.15.22"]

[project.scripts]
light-gamer = "light_gamer.runner:main"
light-gamer-desktop = "light_gamer.desktop.__main__:main"

[tool.setuptools.packages.find]
include = ["light_gamer*"]

[tool.setuptools.package-data]
"light_gamer.desktop" = ["profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py311"
extend-exclude = ["artifacts", "review", "pytest-cache-files-*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
